name: Replume PR check
on:
  pull_request:
    branches: [trial/pr-check-base]

concurrency:
  group: replume-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Replume / verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: mkdir -p "$RUNNER_TEMP/replume-ci"
      - run: npm install -g replume-cli@0.2.1
      - name: Verify the PR merge commit against base policy
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          replume verify --commit HEAD --trusted-base "$BASE_SHA" --isolation worktree --json > "$RUNNER_TEMP/replume-ci/report.json" 2> "$RUNNER_TEMP/replume-ci/verify.log"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/replume-ci/exit.txt"
          cat "$RUNNER_TEMP/replume-ci/verify.log"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replume-pr-result
          path: ${{ runner.temp }}/replume-ci/
          if-no-files-found: error
      - name: Require Replume PASS
        if: always()
        shell: bash
        run: |
          if [ ! -f "$RUNNER_TEMP/replume-ci/exit.txt" ]; then exit 2; fi
          exit "$(cat "$RUNNER_TEMP/replume-ci/exit.txt")"

  publish:
    name: Replume / PR result
    if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: replume-pr-result
          path: replume-ci/
      - name: Update one PR comment and the Replume check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPLUME_REPORT: replume-ci/report.json
          REPLUME_VERIFY_EXIT_FILE: replume-ci/exit.txt
        run: node .github/replume-pr-check-publish.mjs
